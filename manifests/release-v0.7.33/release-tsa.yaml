kind: Namespace
apiVersion: v1
metadata:
  name: tsa-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: tsa-system
  name: secret-operator
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["secrets"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: role-secret-operator
  namespace: tsa-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-operator
subjects:
  - kind: ServiceAccount
    name: createsecret
    namespace: tsa-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: createsecret
  namespace: tsa-system

---
apiVersion: batch/v1
kind: Job
metadata:
  name: createcertchain
  namespace: tsa-system
spec:
  # This number looks crazy, but on k8s 1.23 there does not seem to be
  # exponential backoff, so just keep on trying. For any other version
  # won't run this far by any chance.
  backoffLimit: 90
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: createsecret
      restartPolicy: Never
      automountServiceAccountToken: true
      containers:
        - name: createsecret
          image: ghcr.io/sigstore/scaffolding/createcertchain@sha256:d1df2063cad2ff34af2f9d6893063821d16de7d1cd7b2ef441b35004decfc7cf
          args: ["--secret=tsa-cert-chain"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

---
kind: Namespace
apiVersion: v1
metadata:
  name: tsa-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsa
  namespace: tsa-system
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  namespace: tsa-system
  name: tsa
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
    spec:
      serviceAccountName: tsa
      containers:
        - name: tsa
          image: ghcr.io/sigstore/timestamp-server:v2.0.3@sha256:24f74ba81e5b9523f6b6735cba84bfd0963b6a0be68e1d73ef86db7d38f18fda
          ports:
            - containerPort: 3000
          args: ["serve", "--timestamp-signer=file", "--file-signer-key-path=/var/run/tsa-secrets/signing-secret", "--file-signer-passwd=$(SECRET_SIGNING_PWD)", "--certificate-chain-path=/var/run/tsa-secrets/cert-chain"]
          env:
            - name: SECRET_SIGNING_PWD
              valueFrom:
                secretKeyRef:
                  name: tsa-cert-chain
                  key: signing-secret-password
          volumeMounts:
            - name: tsa-secrets
              mountPath: "/var/run/tsa-secrets"
              readOnly: true
      volumes:
        - name: tsa-secrets
          secret:
            secretName: tsa-cert-chain
            items:
              - key: signing-secret
                path: signing-secret
              - key: cert-chain
                path: cert-chain

---
