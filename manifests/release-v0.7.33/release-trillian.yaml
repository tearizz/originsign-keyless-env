kind: Namespace
apiVersion: v1
metadata:
  name: trillian-system

---
apiVersion: v1
kind: Secret
metadata:
  name: trillian-client
  namespace: trillian-system
type: kubernetes.io/basic-auth
stringData:
  host: mysql-trillian.trillian-system.svc
  name: trillian
  username: trillian
  password: trillian

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: createdb
  namespace: trillian-system

---
apiVersion: batch/v1
kind: Job
metadata:
  name: createdb
  namespace: trillian-system
spec:
  # This number looks crazy, but on k8s 1.23 there does not seem to be
  # exponential backoff, so just keep on trying. For any other version
  # won't run this far by any chance. Also with activeDeadlineSeconds we're
  # capping this to 5 minutes.
  backoffLimit: 90
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: createdb
      restartPolicy: Never
      containers:
        - name: createdb
          image: ghcr.io/sigstore/scaffolding/createdb@sha256:16673c1099a5a0d3c2f2addc5cd57708681f03c650a39b08d62260655f304637
          args: ["--mysql_uri=$(MYSQL_USER):$(MYSQL_PASSWORD)@tcp($(DATABASE_HOSTNAME):3306)/", "--db_name=trillian"]
          env:
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: trillian-client
                  key: name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: trillian-client
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trillian-client
                  key: password
            - name: DATABASE_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: trillian-client
                  key: host

---
kind: Namespace
apiVersion: v1
metadata:
  name: trillian-system

---
apiVersion: v1
kind: Secret
metadata:
  name: trillian-database
  namespace: trillian-system
type: kubernetes.io/basic-auth
stringData:
  host: mysql-trillian.trillian-system.svc
  database-name: trillian
  username: trillian
  password: trillian

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-trillian
  namespace: trillian-system
spec:
  ports:
    - port: 3306
  selector:
    app: mysql-trillian
  clusterIP: None
---
apiVersion: v1
kind: Pod
metadata:
  name: mysql-trillian
  namespace: trillian-system
  labels:
    app: mysql-trillian
spec:
  containers:
    - image: gcr.io/trillian-opensource-ci/db_server@sha256:97e30a9a4cc4d303b296d80e8f3ad852b8380dbe7b8f10d6bcab91b991a0d372
      name: mysql
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: trillian
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: trillian-database
              key: database-name
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: trillian-database
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trillian-database
              key: password
      ports:
        - containerPort: 3306
          name: mysql

---
kind: Namespace
apiVersion: v1
metadata:
  name: trillian-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trillian
  namespace: trillian-system
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  namespace: trillian-system
  name: log-server
  labels:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    spec:
      serviceAccountName: trillian
      containers:
        - name: log-server
          image: gcr.io/projectsigstore/trillian_log_server@sha256:17c4612b6041204f028a7503c35ff844660d61acd7da98b1433f7742fbd4022e # v1.2.2
          args: ["--mysql_uri=$(MYSQL_USER):$(MYSQL_PASSWORD)@tcp($(DATABASE_HOSTNAME):3306)/$(DATABASE_NAME)", "--mysql_max_idle_conns=0", "--tree_gc=false", "--storage_system=mysql", "--quota_system=mysql",
            #        "--etcd_servers=trillian-etcd-cluster-client.etcd-system.svc:2379",
            #        "--etcd_http_service=trillian-logserver-http",
            "--rpc_endpoint=0.0.0.0:8090",
            #        "--http_endpoint=0.0.0.0:8091",
            "--alsologtostderr"]
          env:
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: password
            - name: DATABASE_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: host
          ports:
            - name: h2c
              containerPort: 8090

---
kind: Namespace
apiVersion: v1
metadata:
  name: trillian-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trillian
  namespace: trillian-system
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  namespace: trillian-system
  name: log-signer
  labels:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        # LogSigner is stateful service because it gives promises to flush
        # the SCT to persistent store.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: trillian
      containers:
        - name: log-signer
          args: ["--mysql_uri=$(MYSQL_USER):$(MYSQL_PASSWORD)@tcp($(DATABASE_HOSTNAME):3306)/$(DATABASE_NAME)", "--storage_system=mysql",
            # Either force the master, or use the etcd looks like are the only
            # two options. For now, just use this until we sort etcd stuff out.
            "--force_master",
            #        "--etcd_servers=trillian-etcd-cluster-client.etcd-system.svc:2379",
            "--quota_system=mysql",
            #        "--etcd_http_service=trillian-logsigner-http",
            #        "--http_endpoint=0.0.0.0:8091",
            "--sequencer_guard_window=1s", "--sequencer_interval=20ms", "--num_sequencers=10", "--batch_size=500",
            # No idea what this is...
            # "$(SIGNER_DEQUEUE_BUCKET_FRACTION)",
            "--master_hold_jitter=7200s", "--alsologtostderr"]
          env:
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: password
            - name: DATABASE_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: trillian-database
                  key: host
          image: gcr.io/projectsigstore/trillian_log_signer@sha256:eff0d36cc94e141dff90d133cef6947e2a73a4719153495bdcb2b51d8b384110 # v1.2.2
          ports:
            - name: h2c
              containerPort: 8090

---
kind: Namespace
apiVersion: v1
metadata:
  name: trillian-system

---
apiVersion: batch/v1
kind: Job
metadata:
  name: inactive-tree
  namespace: trillian-system
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cosign
          image: ghcr.io/sigstore/scaffolding/updatetree@sha256:fb4c2c0729e725e3d847a66a4af2ec5f833ed1cb6f3b0db337feccafcd807068
          args: ["--tree_id=0"]

---
